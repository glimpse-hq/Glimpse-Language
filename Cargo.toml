[package]
name = "glimpse-language"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.88"
autoexamples = false
description = "Fast on-device language models for macOS and Windows"
license = "MIT"
repository = "https://github.com/glimpse-hq/Glimpse-Language"
homepage = "https://github.com/glimpse-hq/Glimpse-Language"
documentation = "https://docs.rs/glimpse-language"

[features]
default = []
apple = ["dep:serde"]
bonsai = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:dispatch2", "dep:libc", "dep:half", "dep:regex", "dep:image", "dep:transcribe-cpp-sys", "dep:cc"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
half = { version = "2", default-features = false, optional = true }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"], optional = true }

# The Bonsai Metal runtime. Only built on Apple Silicon.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"], optional = true }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLBuffer", "MTLResource", "MTLAllocation", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary", "MTLTypes", "MTLBlitCommandEncoder", "block2", "dispatch2"], optional = true }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2", "block2"], optional = true }
libc = { version = "0.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

# The Bonsai ggml backend on Windows: libllama (vendor/llama.cpp) built against transcribe.cpp's ggml, so the
# process has one ggml. Keep the rev equal to Glimpse-Speech's transcribe-cpp pin.
[target.'cfg(windows)'.dependencies]
transcribe-cpp-sys = { git = "https://github.com/glimpse-hq/transcribe.cpp.git", rev = "95e3eff8b2b58361b51d96a4f2077ed770aee9f0", default-features = false, features = ["vulkan"], optional = true }

[build-dependencies]
cc = { version = "1", features = ["parallel"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[example]]
name = "apple"
required-features = ["apple"]

[[example]]
name = "bonsai"
required-features = ["bonsai"]

[[example]]
name = "bonsai_suite"
required-features = ["bonsai"]

[[test]]
name = "bonsai_golden"
required-features = ["bonsai"]
